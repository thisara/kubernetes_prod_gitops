apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.15.0"

    helm:
      releaseName: external-secrets

      valuesObject:
        installCRDs: true

        replicaCount: 1

        serviceAccount:
          create: true
          name: external-secrets
          annotations: {}

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

        webhook:
          create: true
          replicaCount: 1

        certController:
          create: true
          replicaCount: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true