apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default

  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: "1.28.0"
    helm:
      releaseName: istiod
      valuesObject:
        meshConfig:
          enableTracing: true

          extensionProviders:
            - name: jaeger
              opentelemetry:
                service: jaeger-collector.istio-system.svc.cluster.local
                port: 4317

        pilot:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true