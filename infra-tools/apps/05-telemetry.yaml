apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-telemetry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: default

  source:
    repoURL: https://github.com/thisara/kubernetes_prod_gitops.git
    targetRevision: master
    path: infra-tools/istio/telemetry

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true