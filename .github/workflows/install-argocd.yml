name: Install ArgoCD on EKS

on:
  workflow_dispatch:

  push:
    branches:
      - master
#    paths:
#      - "argocd/**"
#      - ".github/workflows/install-argocd.yaml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: argocd-install-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  EKS_CLUSTER_NAME: file-api-eks
  ARGOCD_NAMESPACE: argocd
  ARGOCD_RELEASE: argocd

jobs:
  install-argocd:

    name: Install Argo CD

    runs-on:
      - self-hosted
      - eks-platform

    timeout-minutes: 30

    steps:

      - name: Configure runner PATH
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verify installed tools
        run: |
          echo "$PATH"
          aws --version
          kubectl version --client
          helm version
          terraform version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC Claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import base64

          request = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com",
              headers={
                  "Authorization": "Bearer "
                  + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          token = json.load(urllib.request.urlopen(request))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ["iss", "aud", "sub", "repository", "ref"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify EKS connectivity
        run: |
          kubectl get nodes

      - name: Add Argo Helm repository
        run: |
          helm repo add argo \
            https://argoproj.github.io/argo-helm

          helm repo update

      - name: Install or upgrade Argo CD
        run: |
          helm upgrade --install "$ARGOCD_RELEASE" \
            argo/argo-cd \
            --namespace "$ARGOCD_NAMESPACE" \
            --create-namespace \
            --version "$ARGOCD_CHART_VERSION" \
            --values argocd/values.yaml \
            --wait \
            --timeout 10m
        env:
          ARGOCD_CHART_VERSION: ${{ vars.ARGOCD_CHART_VERSION }}

      - name: Verify Argo CD deployment
        run: |
          kubectl rollout status \
            deployment/argocd-server \
            -n "$ARGOCD_NAMESPACE" \
            --timeout=300s

          kubectl get pods \
            -n "$ARGOCD_NAMESPACE"

          helm status "$ARGOCD_RELEASE" \
            -n "$ARGOCD_NAMESPACE"