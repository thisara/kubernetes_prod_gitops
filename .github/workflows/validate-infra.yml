name: Validate Infrastructure GitOps

on:
  pull_request:
    branches:
      - master
    paths:
      - "infra-root/**"
      - "infra-tools/**"
      - ".github/workflows/validate-infra.yml"

  push:
    branches:
      - master
    paths:
      - "infra-root/**"
      - "infra-tools/**"
      - ".github/workflows/validate-infra.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # Validate Kustomize configuration
      - name: Validate infrastructure applications
        run: |
          kubectl kustomize infra-tools/apps \
            > /tmp/infra-applications.yaml

          test -s /tmp/infra-applications.yaml

      # Validate telemetry manifest
      - name: Validate telemetry manifest
        run: |
          kubectl apply \
            --dry-run=client \
            --validate=false \
            -f infra-tools/istio/telemetry/telemetry.yaml \
            -o yaml > /tmp/telemetry-validated.yaml

      # Validate Argo CD source/sources configuration
      - name: Validate Argo CD Application sources
        run: |
          python3 - <<'PY'
          import glob
          import yaml

          files = glob.glob("infra-tools/apps/*.yaml")

          for file in files:
              with open(file) as f:
                  docs = yaml.safe_load_all(f)

                  for doc in docs:
                      if not isinstance(doc, dict):
                          continue

                      if doc.get("kind") != "Application":
                          continue

                      spec = doc.get("spec", {})

                      if "source" in spec:
                          assert isinstance(spec["source"], dict), \
                              f"{file}: spec.source must be an object"

                      if "sources" in spec:
                          assert isinstance(spec["sources"], list), \
                              f"{file}: spec.sources must be an array"

                      assert not ("source" in spec and "sources" in spec), \
                          f"{file}: use either source or sources"

                      print(f"Validated: {file}")
          PY