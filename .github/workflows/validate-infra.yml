name: Validate Infrastructure GitOps

on:
  pull_request:
    branches:
      - master
    paths:
      - "infra-root/**"
      - "infra-tools/**"
      - ".github/workflows/validate-infra.yml"

  push:
    branches:
      - master
    paths:
      - "infra-root/**"
      - "infra-tools/**"
      - ".github/workflows/validate-infra.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install YAML dependencies
        run: |
          python3 -m pip install "PyYAML==6.0.2"

      # Validate Kustomize
      - name: Validate infrastructure applications
        run: |
          kubectl kustomize infra-tools/apps \
            > /tmp/infra-applications.yaml

          test -s /tmp/infra-applications.yaml

      # Validate Istio Telemetry YAML offline
      - name: Validate telemetry manifest
        run: |
          python3 - <<'PY'
          import yaml

          path = "infra-tools/istio/telemetry/telemetry.yaml"

          with open(path) as f:
              documents = list(yaml.safe_load_all(f))

          for document in documents:
              if not document:
                  continue

              assert document.get("apiVersion"), "Missing apiVersion"
              assert document.get("kind"), "Missing kind"
              assert document.get("metadata", {}).get("name"), "Missing metadata.name"

          print("Telemetry YAML validation successful")
          PY

      # Validate Argo CD Application configurations
      - name: Validate Argo CD Applications
        run: |
          python3 - <<'PY'
          import glob
          import yaml

          files = glob.glob("infra-tools/apps/*.yaml")

          for file in files:
              with open(file) as f:
                  for doc in yaml.safe_load_all(f):
                      if not isinstance(doc, dict):
                          continue

                      if doc.get("kind") != "Application":
                          continue

                      spec = doc.get("spec", {})

                      assert not ("source" in spec and "sources" in spec), \
                          f"{file}: Cannot use both source and sources"

                      if "source" in spec:
                          assert isinstance(spec["source"], dict), \
                              f"{file}: spec.source must be an object"

                      if "sources" in spec:
                          assert isinstance(spec["sources"], list), \
                              f"{file}: spec.sources must be an array"

                      assert "source" in spec or "sources" in spec, \
                          f"{file}: Missing source or sources"

                      print(f"Validated: {file}")
          PY