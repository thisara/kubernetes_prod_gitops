apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/thisara/kubernetes_prod_gitops.git
    targetRevision: master
    path: infra-tools/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      